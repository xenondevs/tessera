[versions]
kotlin = "2.4.20"
loom = "1.18.0-alpha.21"

minecraft = "26.3"
jvm = "25"
fabric-loader = "0.19.5"
fabric-api = "0.160.4+26.3"
fabric-kotlin = "1.14.1+kotlin.2.4.20"
sponge-mixin = "0.17.4+mixin.0.8.7"
mixinextras = "0.5.5"
adventure = "5.2.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-fabric", version.ref = "mixinextras" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
