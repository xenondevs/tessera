[versions]
kotlin = "2.4.21"
loom = "1.19.4"

minecraft = "26.3"
jvm = "25"
fabric-loader = "0.20.1"
fabric-api = "0.166.2+26.3"
fabric-kotlin = "1.14.2+kotlin.2.4.21"
neoforge = "26.3.0.45-beta"
neoforge-mod-dev = "2.0.148"
sponge-mixin = "0.17.5+mixin.0.8.7"
mixinextras = "0.5.5"
adventure = "5.2.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-fabric", version.ref = "mixinextras" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
mod-dev = { id = "net.neoforged.moddev", version.ref = "neoforge-mod-dev" }
