name: capture

on:
  release:
    types: [ published ]

permissions: {}

jobs:
  jar:
    if: ${{ startsWith(github.ref_name, 'capture-') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ByteZ1337/setup-mise@v1.0.0
        with:
          version: v2026.11.14
          sha256: fdf945a962cd4a3217f8f6bc8d6bbbbd1c600d0b252cbd05f87652887e020baa

      - name: Install Java
        shell: bash
        run: |
          mise trust
          mise install --locked java
          java_home="$(mise where java)"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      - name: Build
        run: >
          ./gradlew :capture:tessera-capture-fabric:jar :capture:tessera-capture-neoforge:jar --no-build-cache
          -PcaptureVersion="${GITHUB_REF_NAME#capture-}"

      - name: Stage
        run: |
          mkdir dist
          cp capture/tessera-capture-{fabric,neoforge}/build/libs/*-MC-*.jar dist/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: capture
          path: dist/*
          if-no-files-found: error

  sign:
    needs: jar
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: capture
          path: dist

      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*

  github-release:
    needs: sign
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: capture
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
