name: ci

on:
  pull_request:
    paths: &native
      - 'native/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths: *native

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native

      - name: Build
        run: cargo build --locked --manifest-path native/Cargo.toml -p tessera -p tessera-ffi

      - name: Clippy
        run: cargo clippy --locked --manifest-path native/Cargo.toml -p tessera -p tessera-ffi

      - name: Test
        run: cargo test --locked --manifest-path native/Cargo.toml -p tessera -p tessera-ffi
