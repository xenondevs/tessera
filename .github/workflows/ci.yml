name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &native
      - 'native/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths: *native

permissions:
  contents: read

jobs:
  native:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - uses: ByteZ1337/setup-rustup/verify@v1.29.3

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native

      - name: Build
        run: cargo build --locked --manifest-path native/Cargo.toml -p tessera -p tessera-ffi

      - name: Clippy
        run: cargo clippy --locked --manifest-path native/Cargo.toml -p tessera -p tessera-ffi

      - name: Test
        run: cargo test --locked --manifest-path native/Cargo.toml -p tessera -p tessera-ffi
