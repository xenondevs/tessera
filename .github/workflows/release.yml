name: release

# If renamed, update manifest's Sigstore bundle verification. Currently verifies against this file's identity:
#   https://github.com/xenondevs/tessera/.github/workflows/release.yml@refs/tags/*
on:
  release:
    types: [ published ]

permissions: {}

jobs:
  # Built inside manylinux_2_28 to link against older glibc for older platforms
  build-linux:
    if: ${{ !startsWith(github.ref_name, 'capture-') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { variant: linux-x86_64-v2, runner: ubuntu-24.04, image: &manylinux-x86_64 'quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36', target: x86_64-unknown-linux-gnu, flags: '-C target-cpu=x86-64-v2' }
          - { variant: linux-x86_64-v3, runner: ubuntu-24.04, image: *manylinux-x86_64, target: x86_64-unknown-linux-gnu, flags: '-C target-cpu=x86-64-v3' }
          - { variant: linux-x86_64-v4, runner: ubuntu-24.04, image: *manylinux-x86_64, target: x86_64-unknown-linux-gnu, flags: '-C target-cpu=x86-64-v4' }
          - { variant: linux-aarch_64, runner: ubuntu-24.04-arm, image: &manylinux-aarch64 'quay.io/pypa/manylinux_2_28_aarch64:2026.11.07-1@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21', target: aarch64-unknown-linux-gnu, flags: '' }
          - { variant: linux-aarch_64-sve, runner: ubuntu-24.04-arm, image: *manylinux-aarch64, target: aarch64-unknown-linux-gnu, flags: '-C target-cpu=neoverse-v1' }
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ByteZ1337/setup-rustup@v1.29.3

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - uses: ByteZ1337/setup-rustup/verify@v1.29.3
        with:
          host: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.flags }}
        run: cargo build --release --locked --manifest-path native/Cargo.toml -p tessera-ffi --target ${{ matrix.target }}

      # fails the release if anything linked against a glibc symbol newer than the floor
      - name: Check glibc floor
        run: |
          lib="native/target/${{ matrix.target }}/release/libtessera_ffi.so"
          newest=$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -1)" = "2.28" ] || { echo "::error::needs glibc $newest, the floor is 2.28"; exit 1; }

      - name: Stage
        run: |
          mkdir -p dist
          cp "native/target/${{ matrix.target }}/release/libtessera_ffi.so" "dist/tessera_ffi-${{ matrix.variant }}.so"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error

  build:
    if: ${{ !startsWith(github.ref_name, 'capture-') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { variant: windows-x86_64-v2, runner: windows-2025, target: x86_64-pc-windows-msvc, flags: '-C target-cpu=x86-64-v2', lib: tessera_ffi.dll, ext: dll }
          - { variant: windows-x86_64-v3, runner: windows-2025, target: x86_64-pc-windows-msvc, flags: '-C target-cpu=x86-64-v3', lib: tessera_ffi.dll, ext: dll }
          - { variant: windows-x86_64-v4, runner: windows-2025, target: x86_64-pc-windows-msvc, flags: '-C target-cpu=x86-64-v4', lib: tessera_ffi.dll, ext: dll }
          - { variant: osx-aarch_64, runner: macos-15, target: aarch64-apple-darwin, flags: '-C target-cpu=apple-m1', lib: libtessera_ffi.dylib, ext: dylib }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - uses: ByteZ1337/setup-rustup/verify@v1.29.3
        with:
          host: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.flags }}
        run: cargo build --release --locked --manifest-path native/Cargo.toml -p tessera-ffi --target ${{ matrix.target }}

      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "native/target/${{ matrix.target }}/release/${{ matrix.lib }}" "dist/tessera_ffi-${{ matrix.variant }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error

  manifest:
    needs: [build-linux, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - uses: ByteZ1337/setup-mise@v1.0.0
        with:
          version: v2026.11.14
          sha256: fdf945a962cd4a3217f8f6bc8d6bbbbd1c600d0b252cbd05f87652887e020baa

      - name: Install Nushell
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MISE_SAFE=1 mise install --locked aqua:nushell/nushell
          dirname "$(MISE_SAFE=1 mise which nu)" >> "$GITHUB_PATH"

      - name: Manifest
        shell: bash
        run: nu .github/scripts/make-manifest.nu dist "${GITHUB_REF_NAME#v}" > manifest.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: manifest
          path: manifest.json
          if-no-files-found: error

  jar:
    needs: manifest
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8.0.2
        with:
          name: manifest
          path: dist

      - uses: ByteZ1337/setup-mise@v1.0.0
        with:
          version: v2026.11.14
          sha256: fdf945a962cd4a3217f8f6bc8d6bbbbd1c600d0b252cbd05f87652887e020baa

      - name: Install Java
        shell: bash
        run: |
          mise trust
          mise install --locked java
          java_home="$(mise where java)"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      # embeds dist/manifest.json as natives.properties
      - name: Build
        run: >
          ./gradlew jar sourcesJar --no-build-cache
          -PpublishOnly -PtesseraVersion="${GITHUB_REF_NAME#v}" -PnativeDist="$PWD/dist"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

  sign:
    needs: jar
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8.0.2
        with:
          name: manifest
          path: dist

      - uses: actions/download-artifact@v8.0.2
        with:
          name: jar
          path: dist

      - uses: ByteZ1337/setup-mise@v1.0.0
        with:
          version: v2026.11.14
          sha256: fdf945a962cd4a3217f8f6bc8d6bbbbd1c600d0b252cbd05f87652887e020baa

      - name: Install Cosign
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MISE_SAFE=1 mise install --locked aqua:sigstore/cosign
          dirname "$(MISE_SAFE=1 mise which cosign)" >> "$GITHUB_PATH"

      - name: Sign manifest
        run: cosign sign-blob --yes --bundle dist/manifest.json.sigstore.json dist/manifest.json

      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  maven:
    needs: sign
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: signed
          path: dist

      - uses: ByteZ1337/setup-mise@v1.0.0
        with:
          version: v2026.11.14
          sha256: fdf945a962cd4a3217f8f6bc8d6bbbbd1c600d0b252cbd05f87652887e020baa

      - name: Install Java
        shell: bash
        run: |
          mise trust
          mise install --locked java
          java_home="$(mise where java)"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      - name: Rebuild and compare with the attested jar
        run: |
          ./gradlew jar sourcesJar --no-build-cache \
            -PpublishOnly -PtesseraVersion="${GITHUB_REF_NAME#v}" -PnativeDist="$PWD/dist"
          for jar in build/libs/*.jar; do
            cmp "$jar" "dist/$(basename "$jar")" || { echo "::error::$(basename "$jar") differs from the attested build"; exit 1; }
          done

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_xenondevsUsername: ${{ secrets.XENONDEVS_RELEASES_USERNAME }}
          ORG_GRADLE_PROJECT_xenondevsPassword: ${{ secrets.XENONDEVS_RELEASES_PASSWORD }}
        run: >
          ./gradlew publish --no-build-cache
          -PpublishOnly -PtesseraVersion="${GITHUB_REF_NAME#v}" -PnativeDist="$PWD/dist"

  github-release:
    needs: sign
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: signed
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
